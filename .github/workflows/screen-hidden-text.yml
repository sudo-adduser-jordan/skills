name: screen-hidden-text

on:
  push:
    paths:
      - ".agents/**"
      - "skills-lock.json"
      - "scripts/screen_hidden_text.py"
  pull_request:
    paths:
      - ".agents/**"
      - "skills-lock.json"
      - "scripts/screen_hidden_text.py"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Screen vendored skills for hidden text
        run: python3 scripts/screen_hidden_text.py .agents
