name: vendor-sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Vendor skills
        run: task vendor
      - name: Show drift
        run: git status --short
      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(vendor): sync agent skills"
          title: "chore(vendor): sync agent skills"
          body: "Automated skills sync via `npx skills add` (see skills-lock.json). Review diff + hidden-text screen before merging."
          branch: chore/vendor-sync
          delete-branch: true
